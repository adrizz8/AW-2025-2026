<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Vehículos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .filtros {
            margin: 20px 0;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
        }
        .filtros a {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }
        .filtros a:hover {
            background-color: #0056b3;
        }
        .busqueda {
            margin: 20px 0;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
        }
        .busqueda input {
            padding: 8px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .busqueda button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .busqueda button:hover {
            background-color: #218838;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 15px;
            margin: 5px 0;
            background-color: white;
            border-left: 4px solid #007bff;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Tipos de Vehículos</h1>
    
    <div class="filtros">
        <strong>Filtros rápidos:</strong><br><br>
        <a href="/vehiculos">Todos</a>
        <a href="/vehiculos?tipo=coche">Coche</a>
        <a href="/vehiculos?tipo=moto">Moto</a>
        <a href="/vehiculos?tipo=camión">Camión</a>
        <a href="/vehiculos?format=json">Ver JSON</a>
    </div>

    <div class="busqueda">
        <strong>Buscar tipo:</strong><br><br>
        <form action="/vehiculos" method="GET">
            <input type="text" name="tipo" placeholder="Ej: moto, coche...">
            <button type="submit">Buscar</button>
        </form>
    </div>
    
    <p>{{MENSAJE}}</p>
    
    <ul>
        {{LISTA_VEHICULOS}}
    </ul>
    
    <p><a href="/">Volver al inicio</a></p>
</body>
</html>
