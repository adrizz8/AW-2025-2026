<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sistema de Gestión de Reservas</title>
  <style>
    /* Estilo mínimo y agradable */
    :root { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f6f9ff 0%, #ffffff 40%, #eef7f1 100%);
      color: #0b2545;
    }
    .card {
      max-width: 680px;
      width: 90%;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(11,37,69,0.08);
      background: #ffffff;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.9rem; }
    p { margin: 0 0 18px; color: #2e486b; }
    .cta {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      background: #1f6feb;
      color: white;
      font-weight: 600;
    }
    .meta { margin-top: 14px; font-size: 0.9rem; color: #6b7b93; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Bienvenido al Sistema de Gestión de Reservas</h1>
    <p>Gestiona fácilmente tus reservas, consulta disponibilidad y administra clientes desde un solo lugar.</p>
    <a class="cta" href="/reservar">Reservar vehículo</a>
    <a class = "cta" href="/lista_reservas">Ver reservas</a>
    <a class = "cta" href="/vehiculos">Gestionar Vehiculos</a>
    <div class="meta">¿Nuevo? Empieza creando tu primera reserva ✨</div>
  </main>
</body>
</html>
